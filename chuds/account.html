<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuds — Account</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar-root"></div>

  <main class="page">
    <a class="eyebrow-link" href="index.html">&larr; Back to leaderboard</a>

    <div class="account-head">
      <div class="account-avatar" id="avatar-preview">
        <svg id="avatar-default-icon" viewBox="0 0 24 24" fill="currentColor" style="fill:#8b96ac">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.7-9.8 5v2.3h19.6V19.5c0-3.3-6.5-5-9.8-5z"/>
        </svg>
        <img id="avatar-img" style="display:none;" alt="" />
      </div>
      <div>
        <div class="account-name-row">
          <input id="username-input" class="account-name-input" type="text" maxlength="24" />
        </div>
        <div id="stat-row" class="stat-row"></div>
        <div id="username-saved-msg" class="status-msg"></div>
        <p class="help-text" id="signed-in-as" style="margin-top:12px;">&nbsp;</p>
      </div>
    </div>

    <div class="field" style="max-width:420px;">
      <label for="photo-input">Profile photo</label>
      <label class="file-drop" id="photo-drop-zone" for="photo-input">
        <span id="photo-drop-text">Drag a photo here, or click to browse</span>
        <input id="photo-input" type="file" accept="image/*" style="display:none;" />
      </label>
      <div id="photo-status-msg" class="status-msg"></div>
    </div>

    <h2 class="section-title">Your best lifts</h2>
    <div id="lift-list" class="lift-list"></div>

    <button id="sign-out-btn" class="btn" style="margin-top:40px;" type="button">Sign out</button>

    <div id="admin-panel" style="display:none; margin-top:24px; padding-top:24px; border-top:1px solid var(--line);">
      <h2 class="section-title" style="margin-top:0;">Admin</h2>
      <button id="force-run-btn" class="btn" type="button">Force run tonight's points now</button>
      <p class="help-text">Testing tool — instantly awards points/streaks for the current standings instead of waiting for a real day to pass. Only visible to you. Don't click it more than once per real day, or that night gets double-counted.</p>
      <div id="force-run-msg" class="status-msg"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/format.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
